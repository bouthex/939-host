[package]
name = "host939-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Servidor lógico persistente entre las PCs del grupo: permiso de anfitrión, sincronización, traspaso y recuperación."

[dependencies]
host939-core = { path = "../core" }
host939-p2p = { path = "../p2p" }
iroh = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
blake3 = "1"
data-encoding = "2"
getrandom = "0.2"

[features]
# Ganchos para simular fallas en las pruebas (PC lenta, copia que falla). No se usa en la app.
pruebas = []

[[bin]]
name = "939node"
required-features = ["pruebas"]

[dev-dependencies]
tempfile = "3"

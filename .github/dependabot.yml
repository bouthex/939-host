version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    # Los saltos de versión mayor se revisan a mano (pueden romper la compatibilidad).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

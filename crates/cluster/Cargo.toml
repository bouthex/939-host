[package]
name = "host939-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Servidor lógico persistente entre las PCs del grupo: permiso de anfitrión, sincronización, traspaso y recuperación."

[dependencies]
host939-core = { path = "../core" }
host939-p2p = { path = "../p2p" }
iroh = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

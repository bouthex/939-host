[package]
name = "host939-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Núcleo de 939 Host: servidores, mods, backups, hardware e identidad (sin interfaz)"

[lib]
name = "host939_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls", "http2"] }
futures-util = "0.3"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
ed25519-dalek = "2"
getrandom = "0.2"
data-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
flate2 = "1"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

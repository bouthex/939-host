[package]
name = "host939"
version.workspace = true
description = "939 Host — crear, administrar y hostear servidores de Minecraft Java"
authors = ["bouthex and 939 Host contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.77"

[[bin]]
name = "939Host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
host939-core = { path = "../crates/core" }
host939-p2p = { path = "../crates/p2p" }
host939-cluster = { path = "../crates/cluster" }
host939-update = { path = "../crates/update" }
iroh = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
# Misma versión que usa Tauri (wry): para bajar la memoria de WebView2 con la ventana minimizada.
webview2-com = "0.39"
windows-core = "0.62"
# Apagado de Windows (WM_QUERYENDSESSION + ShutdownBlockReasonCreate). Misma versión que el núcleo.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[features]
# Compilación de prueba de la CI (puerto de depuración para la prueba de interfaz). Nunca en releases.
pruebas = []

[workspace]
resolver = "2"
members = ["crates/core", "crates/p2p", "crates/cluster", "crates/update", "src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bouthex/939-host"
homepage = "https://github.com/bouthex/939-host"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
